# ============================================================
# Cloudflare Workers Deployment Configuration for PSDM.web 2.0
# ============================================================
name = "psdm-portal"
main = "src/server/index.ts"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

# Build Configuration (dist di-build terpisah dengan npm run build)
# [build]
# command = "npm run build"

# Static Assets for React 19 Frontend (Cloudflare Workers Assets)
# not_found_handling = "single-page-application" ensures SPA routes
# like /login, /dashboard are served index.html instead of 404.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Environment Variables for Edge Serverless Runtime
[vars]
B2_BUCKET_NAME = "PSDM-B2"
B2_ENDPOINT = "https://s3.us-west-004.backblazeb2.com"
B2_REGION = "us-west-004"
# Set ALLOWED_ORIGIN to your production domain, e.g. https://psdm-portal.pages.dev or https://psdm.example.org
ALLOWED_ORIGIN = "https://psdm-portal.pages.dev"

# Note: Secret variables should be injected via `wrangler secret put <KEY>`:
# - TURSO_DATABASE_URL
# - TURSO_AUTH_TOKEN
# - SESSION_SECRET
# - B2_APPLICATION_KEY_ID
# - B2_APPLICATION_KEY
# - WA_BOT_URL (contoh: https://wa-bot.domain-anda.com atau https://xxxx.trycloudflare.com)
# - WA_API_KEY (secret token yang sama dengan di microservice Home Server)
